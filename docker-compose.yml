
services:
  db:
    image: postgres:17-alpine
    container_name: alumni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alumni_db
      POSTGRES_USER: alumni_user
      POSTGRES_PASSWORD: AlumniLocalDev_2026
    ports:
      - "5432:5432"
    volumes:
      - alumni_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumni_user -d alumni_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  alumni_postgres_data:
